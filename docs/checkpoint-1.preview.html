<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>spark-to-spec · Identity Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Tomorrow:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <style>
    body {
      background-color: var(--color-paper);
      color: var(--color-ink);
      font-family: var(--font-body);
      padding: var(--space-12);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-8);
      min-height: 100vh;
      margin: 0;
    }
    
    .logo-container {
      width: 200px;
      height: 200px;
      color: var(--color-ink);
    }
    
    .title {
      font-family: var(--font-display);
      font-size: var(--text-4xl);
      letter-spacing: -0.02em;
      margin: 0;
    }
    
    .palette {
      display: flex;
      gap: var(--space-4);
      margin-top: var(--space-8);
    }
    
    .swatch {
      width: 80px;
      height: 80px;
      border-radius: var(--radius-md);
      border: 1px solid var(--color-rule);
      display: flex;
      align-items: flex-end;
      padding: var(--space-2);
      font-size: var(--text-xs);
      font-family: var(--font-outlier);
    }
    
    .swatch-paper { background-color: var(--color-paper); }
    .swatch-accent { background-color: var(--color-accent); color: var(--color-paper); }
    .swatch-ink { background-color: var(--color-ink); color: var(--color-paper); }
    
    .instruction {
      font-family: var(--font-outlier);
      color: var(--color-accent);
      margin-top: var(--space-12);
      font-size: var(--text-sm);
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img src="assets/logo.svg" alt="spark-to-spec logo" style="width: 100%; height: 100%;">
  </div>
  
  <h1 class="title">spark-to-spec</h1>
  
  <div class="palette">
    <div class="swatch swatch-paper">PAPER</div>
    <div class="swatch swatch-accent">ACCENT</div>
    <div class="swatch swatch-ink">INK</div>
  </div>

  <div class="instruction">
    CHECKPOINT 1: Brand Identity & Tokens
  </div>
</body>
</html>
